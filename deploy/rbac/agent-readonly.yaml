# S2-06 : identité Kubernetes de l'agent OpsPilot, en LECTURE SEULE.
# Utilisée quand l'agent tournera dans le cluster (Sprint 7). Les Secrets ne sont volontairement PAS lisibles.
apiVersion: v1
kind: Namespace
metadata:
  name: opspilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-agent
  namespace: opspilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opspilot-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opspilot-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opspilot-agent-readonly
subjects:
  - kind: ServiceAccount
    name: opspilot-agent
    namespace: opspilot
